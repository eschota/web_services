location = /abris {
    alias @@RELEASE@@/static/abris/index.html;
    default_type text/html;
    expires -1;
}

location = /abris/ {
    return 308 /abris;
}

location ^~ /static/abris/ {
    alias @@RELEASE@@/static/abris/;
    autoindex off;
    types {
        text/css css;
        text/html html;
        application/javascript mjs js;
        application/json json;
        image/svg+xml svg;
        image/jpeg jpeg jpg;
        image/png png;
        image/webp webp;
        font/woff2 woff2;
    }
    expires -1;
}

location = /abris/api/health {
    client_max_body_size 1k;
    include @@PROXY@@;
}

location = /abris/api/recognize {
    client_max_body_size 24m;
    limit_conn autorig_abris_ip 1;
    limit_conn autorig_abris_total 4;
    limit_conn_status 429;
    limit_req zone=autorig_abris_rate burst=4 nodelay;
    limit_req_status 429;
    include @@PROXY@@;
}

location = /abris/api/dwg {
    client_max_body_size 2m;
    limit_conn autorig_abris_ip 1;
    limit_conn autorig_abris_total 4;
    limit_conn_status 429;
    limit_req zone=autorig_abris_rate burst=4 nodelay;
    limit_req_status 429;
    include @@PROXY@@;
}

location ^~ /abris/api/ {
    access_log off;
    return 404;
}
