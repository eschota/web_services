<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#242424">
  <meta name="description" content="Редактор полевых абрисов и поэтажных планов. Загрузка обмеров, проверка размеров и экспорт чертежей.">
  <title>Абрис — редактор поэтажных планов</title>
  <link rel="stylesheet" href="/static/abris/style.css">
  <link rel="stylesheet" href="/static/abris/editor.css">
  <link rel="stylesheet" href="/static/abris/vision.css">
  <script type="module" src="/static/abris/app.mjs"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-library" aria-hidden="true">
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M5 15v5h14v-5"/></symbol>
    <symbol id="icon-save" viewBox="0 0 24 24"><path d="M5 4h12l3 3v13H4V4h1zM8 4v6h8V4M8 20v-6h8v6"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 4v12m-4-4 4 4 4-4M5 17v3h14v-3"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m10 7 5 5-5 5"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12 4 8 5-8 5-8-5 8-5zM4 13l8 5 8-5M4 17l8 5 8-5"/></symbol>
    <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6m-6 4h4"/></symbol>
    <symbol id="icon-select" viewBox="0 0 24 24"><path d="m6 3 13 11-6 1-3 5-4-17z"/></symbol>
    <symbol id="icon-rectangle" viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/></symbol>
    <symbol id="icon-wall" viewBox="0 0 24 24"><path d="m6 18 12-12M4 16l4 4M16 4l4 4"/></symbol>
    <symbol id="icon-opening" viewBox="0 0 24 24"><path d="M4 19h4m10 0h2M8 19V5a14 14 0 0 1 10 14H8"/></symbol>
    <symbol id="icon-symbol" viewBox="0 0 24 24"><path d="M4 17h5v-5h5V7h6M4 20h16V4"/></symbol>
    <symbol id="icon-pan" viewBox="0 0 24 24"><path d="M8 13V7a1.5 1.5 0 0 1 3 0v4-6a1.5 1.5 0 0 1 3 0v6-4a1.5 1.5 0 0 1 3 0v5-2a1.5 1.5 0 0 1 3 0v4a7 7 0 0 1-7 7h-1a5 5 0 0 1-4.4-2.7L4.9 13a1.6 1.6 0 0 1 2.5-1.8L9 13"/></symbol>
    <symbol id="icon-fit" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/><path d="M9 9h6v6H9z"/></symbol>
    <symbol id="icon-overlay" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-generate" viewBox="0 0 24 24"><path d="m4 17 12-12 4 4L8 21l-4-4zm3-3 4 4m0-8 3 3m1-7 3 3"/></symbol>
    <symbol id="icon-sketch" viewBox="0 0 24 24"><path d="M4 17c3-5 4-6 7-6 3 0 1 7 4 7s4-5 5-7M4 8l11-3 2 3-9 3-4-3z"/></symbol>
    <symbol id="icon-plan" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 12h7m2 0h7M12 4v6m0 5v5"/></symbol>
  </svg>
  <header class="topbar">
    <a class="brand" href="/abris" aria-label="Абрис, редактор планов">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <path class="mark-fill" d="M0 0h40v40H0z"/>
        <path d="M9 30V10h22v20H9zm0-11h12v-9m0 14v6m0-11h10"/>
        <path class="mark-thin" d="M7 35h26M4 10v20M35 10v20"/>
      </svg>
      <span>Абрис</span>
    </a>
    <div class="project-label">
      <input id="project-name" class="project-name" aria-label="Название проекта" type="text" value="Демонстрационный дом" maxlength="140" spellcheck="false">
      <button id="meta-btn" class="top-icon" type="button" aria-label="Данные проекта" title="Данные проекта">
        <svg class="icon" aria-hidden="true"><use href="#icon-file"/></svg>
      </button>
    </div>
    <div class="top-actions">
      <button id="save-btn" class="top-button" type="button" aria-label="Сохранить проект в JSON" title="Сохранить проект в JSON">
        <svg class="icon" aria-hidden="true"><use href="#icon-save"/></svg><span>Сохранить</span>
      </button>
      <button id="export-btn" class="top-button top-export" type="button" aria-label="Экспорт чертежа" title="Экспорт чертежа" aria-haspopup="dialog">
        <svg class="icon" aria-hidden="true"><use href="#icon-download"/></svg><span>Экспорт</span><svg class="icon small" aria-hidden="true"><use href="#icon-chevron"/></svg>
      </button>
    </div>
  </header>

  <main class="studio">
    <aside class="project-panel panel" aria-labelledby="floors-heading">
      <div class="panel-top project-top">
        <div class="panel-heading"><svg class="icon" aria-hidden="true"><use href="#icon-layers"/></svg><h1 id="floors-heading">Этажи</h1></div>
        <button id="add-floor" class="icon-button" type="button" aria-label="Добавить этаж" title="Добавить этаж"><svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg></button>
      </div>
      <div id="floors-list" class="floor-list" aria-label="Список этажей"></div>
      <div class="project-source">
        <input id="import-file" type="file" accept="image/jpeg,image/png,image/tiff,application/pdf,.jpg,.jpeg,.png,.tif,.tiff,.pdf,.json" hidden>
        <button id="import-btn" class="import-control" type="button" title="Загрузить фото, скан или проект">
          <svg class="icon" aria-hidden="true"><use href="#icon-upload"/></svg>
          <span><strong>Загрузить абрис</strong><small>JPG, PNG, TIFF, PDF, JSON</small></span>
        </button>
        <p id="file-summary" class="file-summary" hidden></p>
        <button id="demo-btn" class="demo-control" type="button" title="Открыть демонстрационный проект"><svg class="icon" aria-hidden="true"><use href="#icon-plan"/></svg><span>Открыть пример</span><svg class="icon small" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button>
      </div>
      <div id="notice" class="notice" hidden></div>
    </aside>

    <section class="workbench" aria-label="Рабочая область">
      <div class="bench-top">
        <div class="view-switch" role="group" aria-label="Режим просмотра">
          <button id="view-scan" class="mode-button" type="button" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#icon-sketch"/></svg>Абрис</button>
          <button id="view-plan" class="mode-button" type="button" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#icon-plan"/></svg>Чертёж</button>
        </div>
        <label class="opacity-control" title="Прозрачность подложки скана">
          <svg class="icon" aria-hidden="true"><use href="#icon-overlay"/></svg><span>Подложка</span>
          <input id="opacity" aria-label="Прозрачность подложки" type="range" min="0" max="100" value="65">
        </label>
      </div>
      <div id="desk" class="desk">
        <div id="stage" aria-label="Подложка и геометрия абриса"></div>
        <div id="sheet" class="sheet" aria-label="Печатный лист" hidden></div>
        <div class="tool-dock" role="group" aria-label="Инструменты редактирования">
          <button type="button" class="tool" data-tool="select" aria-pressed="true" aria-label="Выбрать" title="Выбрать"><svg class="icon" aria-hidden="true"><use href="#icon-select"/></svg></button>
          <button type="button" class="tool" data-tool="room" aria-pressed="false" aria-label="Добавить помещение" title="Добавить помещение"><svg class="icon" aria-hidden="true"><use href="#icon-rectangle"/></svg></button>
          <button type="button" class="tool" data-tool="wall" aria-pressed="false" aria-label="Добавить стену" title="Добавить стену"><svg class="icon" aria-hidden="true"><use href="#icon-wall"/></svg></button>
          <button type="button" class="tool" data-tool="opening" aria-pressed="false" aria-label="Добавить проём" title="Добавить проём"><svg class="icon" aria-hidden="true"><use href="#icon-opening"/></svg></button>
          <button type="button" class="tool" data-tool="symbol" aria-pressed="false" aria-label="Добавить условный знак" title="Добавить условный знак"><svg class="icon" aria-hidden="true"><use href="#icon-symbol"/></svg></button>
          <button type="button" class="tool" data-tool="pan" aria-pressed="false" aria-label="Переместить подложку" title="Переместить подложку"><svg class="icon" aria-hidden="true"><use href="#icon-pan"/></svg></button>
        </div>
        <div class="zoom-dock" role="group" aria-label="Масштаб просмотра">
          <button id="zoom-out" type="button" aria-label="Уменьшить" title="Уменьшить"><svg class="icon" aria-hidden="true"><use href="#icon-minus"/></svg></button>
          <output id="zoom-value" aria-label="Масштаб просмотра">100%</output>
          <button id="zoom-in" type="button" aria-label="Увеличить" title="Увеличить"><svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg></button>
          <button id="fit" type="button" aria-label="Вписать в рабочую область" title="Вписать в рабочую область"><svg class="icon" aria-hidden="true"><use href="#icon-fit"/></svg></button>
        </div>
      </div>
    </section>

    <aside class="details-panel panel" aria-label="Свойства и оформление">
      <div class="panel-top detail-top">
        <div class="panel-heading"><h2>Свойства</h2></div>
        <span id="room-count" class="room-count" hidden></span>
      </div>
      <div id="inspector" class="inspector"></div>
      <div class="draft-settings">
        <h2>Оформление листа</h2>
        <div class="setting-controls">
          <label class="setting profile-setting"><span>Профиль</span><select id="profile"><option value="TECH_PLAN_P0082">Технический план</option><option value="BTI">Технический паспорт</option></select></label>
          <label class="setting scale-setting"><span>Масштаб</span><select id="scale"><option value="1:50">1:50</option><option value="1:100" selected>1:100</option><option value="1:200">1:200</option></select></label>
        </div>
        <button id="generate" class="generate-button" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-generate"/></svg>Создать чертёж</button>
      </div>
    </aside>
  </main>

  <footer class="statusbar">
    <span class="status-dot" aria-hidden="true"></span>
    <span id="status" role="status" aria-live="polite">Открываем проект…</span>
    <span class="status-unit">Промеры в сантиметрах</span>
  </footer>
</body>
</html>
