<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <!-- TASK_SEO_PLACEHOLDER -->
    <title>Task Progress | AutoRig.online</title>
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('autorig_theme')||'dark')}catch(e){}</script>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/task-v3.css">
    <link rel="stylesheet" href="/static/css/task-v3-downloads.css">
    <link rel="stylesheet" href="/static/css/public-chat.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T4E781EHE4"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-T4E781EHE4');
    </script>
</head>
<body class="task-v3-page" data-task-page="v3">
    <div id="site-header"></div>

    <main class="tv3" id="tv3">
        <section class="tv3-stage" id="tv3-stage" aria-label="3D viewer">
            <nav class="tv3-tools" id="tv3-tools" aria-label="Task">
                <a class="tv3-tool" id="tv3-classic" href="#" title="Download" aria-label="Download" data-i18n-title="dlv3_title" data-i18n-aria-label="dlv3_title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/></svg></a>
                <button class="tv3-tool" id="tv3-share" type="button" title="Copy link" aria-label="Copy link" data-i18n-title="taskv3_tool_share" data-i18n-aria-label="taskv3_tool_share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg></button>
                <button class="tv3-tool" id="tv3-full" type="button" title="Fullscreen" aria-label="Fullscreen" data-i18n-title="taskv3_tool_fullscreen" data-i18n-aria-label="taskv3_tool_fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
                <span class="tv3-build" id="tv3-build" hidden></span>
                <span class="tv3-chip" id="tv3-chip" hidden></span>
            </nav>
            <div class="tv3-viewport">
                <iframe id="tv3-viewer" class="tv3-viewer" title="AutoRig 3D viewer" allow="fullscreen; autoplay; xr-spatial-tracking" allowfullscreen hidden></iframe>

                <div class="tv3-card" id="tv3-card" aria-live="polite">
                    <ol class="tv3-steps" id="tv3-steps">
                        <li data-step="queue" title="Queue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h6"/><circle cx="18" cy="16" r="3"/></svg></li>
                        <li data-step="process" title="Processing"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/></svg></li>
                        <li data-step="model" title="Model"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></li>
                        <li data-step="rig" title="Rig"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.5" r="1.8"/><path d="M12 6.5v6M12 12.5l-4 7M12 12.5l4 7M7 9h10"/></svg></li>
                    </ol>
                    <div class="tv3-bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="tv3-fill"></i></div>
                    <p class="tv3-line"><span id="tv3-line">…</span><b id="tv3-pct"></b></p>
                </div>
            </div>
        </section>

        <section class="tv3-info container-sm">
            <h2 data-i18n="task_title" class="task-status-header-title">AutoRig task</h2>
            <div class="tv3-desc"><!-- TASK_V3_DESCRIPTION --></div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="/static/js/header.js"></script>
    <script src="/static/js/footer.js"></script>
    <script src="/static/js/site-layout.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script type="module" src="/static/js/task-v3-shell.js"></script>
    <script type="module" src="/static/js/task-v3-downloads.js"></script>
    <script defer src="/static/js/public-chat.js"></script>
</body>
</html>
