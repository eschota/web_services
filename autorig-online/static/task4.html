<body class="t4" data-task-page="t4">
    <header class="t4-bar">

        <span class="t4-chip" id="t4-cat" hidden></span>

            <button class="t4-btn" id="t4-share" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg><span data-t="b_share">Share</span></button>

    <main class="t4-stage" id="t4-stage">

            <div class="t4-st-bar" id="t4-st-bar" hidden><i></i></div>

        <div class="t4-dock" id="t4-dock" hidden>
            <div class="t4-clips" id="t4-clips"></div>
            <div class="t4-modes" id="t4-modes">
                <button class="t4-chipbtn on" data-mode="pbr" type="button" title="1" data-t="m_pbr">Textured</button>
                <button class="t4-chipbtn" data-mode="clay" type="button" title="2" data-t="m_clay">Clay</button>
                <button class="t4-chipbtn rig" data-mode="weights" type="button" title="3" data-t="m_weights">Weights</button>
                <button class="t4-chipbtn rig" id="t4-bones" type="button" title="B" data-t="m_bones">Bones</button>

        <div class="t4-stats" id="t4-stats"></div>

            <header><b data-t="dl_title">Download</b><button class="t4-x" id="t4-drawer-close" type="button" aria-label="Close">×</button></header>
            <div id="t4-drawer-body"></div>
        </aside>
        <div class="t4-toast" id="t4-toast" hidden role="status"></div>
