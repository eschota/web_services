<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatars — Reusable Characters | AutoRig</title>
    <meta name="description" content="Drop one picture or one video and get a reusable character: front, face, full body, three-quarter, profile and back views, checked for consistency and ready for image and video nodes.">
    <link rel="canonical" href="https://autorig.online/avatars">
    <link rel="icon" type="image/svg+xml" href="/static/images/logo/favicon.svg">
    <link rel="stylesheet" href="/static/css/styles.css">
    <script defer src="/static/js/ai-avatars.js?v=20260923-avatar-build1"></script>
    <style>
        :root { --av-accent:#7b5cff; --av-cyan:#38bdf8; --av-ok:#4ade80; --av-warn:#fbbf24; --av-bad:#fb7185; --av-card:rgba(18,19,38,.78); --av-line:rgba(255,255,255,.1); --av-muted:#9aa0b5; }
        * { box-sizing:border-box; }
        body.avatar-page { margin:0; min-height:100vh; color:#eef; background:radial-gradient(circle at 10% 5%,rgba(56,189,248,.13),transparent 34%),radial-gradient(circle at 90% 8%,rgba(123,92,255,.2),transparent 38%),linear-gradient(180deg,#101122,#14152a 52%,#0f101c); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
        button,input { font:inherit; }
        .av-bar { position:sticky; top:0; z-index:8; display:flex; align-items:center; gap:16px; padding:13px 20px; border-bottom:1px solid var(--av-line); background:rgba(12,13,26,.88); backdrop-filter:blur(10px); }
        .av-brand { color:#fff; font-weight:750; font-size:17px; text-decoration:none; }
        .av-bar nav { margin-left:auto; display:flex; gap:17px; }
        .av-bar nav a { color:var(--av-muted); text-decoration:none; font-size:14px; }
        .av-bar nav a:hover,.av-bar nav a[aria-current="page"] { color:#fff; }
        .av-wrap { width:min(1220px,calc(100% - 32px)); margin:0 auto; padding:28px 0 80px; }
        h1.av-title { margin:0 0 18px; font-size:26px; letter-spacing:-.02em; display:flex; align-items:center; gap:10px; }
        .av-build { display:grid; grid-template-columns:minmax(220px,300px) 1fr; gap:18px; padding:16px; border:1px solid var(--av-line); border-radius:16px; background:var(--av-card); margin-bottom:22px; }
        .av-drop { position:relative; aspect-ratio:3/4; border:1.5px dashed rgba(56,189,248,.5); border-radius:14px; background:rgba(7,9,20,.55); display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; }
        .av-drop.dragging { border-color:#fff; background:rgba(56,189,248,.12); }
        .av-drop img,.av-drop video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
        .av-drop svg.av-drop-icon { width:64px; height:64px; color:var(--av-cyan); }
        .av-drop svg .arrow { animation:avbob 1.6s ease-in-out infinite; }
        @keyframes avbob { 50% { transform:translateY(-4px); } }
        .av-side { display:flex; flex-direction:column; gap:12px; min-width:0; }
        .av-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .av-chip { display:flex; align-items:center; gap:6px; border:1px solid var(--av-line); border-radius:10px; padding:4px 8px; background:rgba(8,9,18,.7); flex:1; min-width:150px; }
        .av-chip svg { width:18px; height:18px; color:var(--av-muted); flex:none; }
        .av-chip input { border:0; outline:0; background:transparent; color:#eef; width:100%; padding:5px 0; font-size:13px; }
        .av-icon-btn { width:44px; height:44px; border-radius:12px; border:1px solid var(--av-line); background:rgba(255,255,255,.06); color:#fff; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
        .av-icon-btn svg { width:22px; height:22px; }
        .av-icon-btn.primary { border:0; color:#071018; background:linear-gradient(135deg,var(--av-cyan),var(--av-accent)); width:56px; }
        .av-icon-btn:disabled { opacity:.45; cursor:not-allowed; }
        .av-icon-btn:not(:disabled):hover { filter:brightness(1.15); }
        .av-stages { display:flex; gap:6px; align-items:center; }
        .av-stage { width:34px; height:34px; border-radius:50%; border:1.5px solid var(--av-line); display:flex; align-items:center; justify-content:center; color:var(--av-muted); position:relative; }
        .av-stage svg { width:17px; height:17px; }
        .av-stage.active { color:var(--av-cyan); border-color:var(--av-cyan); animation:avpulse 1.2s ease-in-out infinite; }
        .av-stage.done { color:#071018; background:var(--av-ok); border-color:var(--av-ok); }
        .av-stage.failed { color:#fff; background:var(--av-bad); border-color:var(--av-bad); }
        @keyframes avpulse { 50% { box-shadow:0 0 0 6px rgba(56,189,248,.15); } }
        .av-stage-line { flex:1; height:2px; background:var(--av-line); min-width:8px; }
        .av-views { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; }
        .av-slot { position:relative; aspect-ratio:2/3; border-radius:8px; background:#0a0b16; border:1px solid var(--av-line); overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--av-muted); }
        .av-slot img { width:100%; height:100%; object-fit:cover; cursor:zoom-in; }
        .av-slot svg.slot-icon { width:22px; height:22px; opacity:.55; }
        .av-slot.pending svg.slot-icon { animation:avspin 1.4s linear infinite; }
        .av-badge { position:absolute; right:4px; top:4px; width:18px; height:18px; border-radius:50%; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; color:#071018; }
        .av-badge.passed { background:var(--av-ok); } .av-badge.accepted_with_warnings { background:var(--av-warn); } .av-badge.failed { background:var(--av-bad); color:#fff; } .av-badge.unchecked { background:#64748b; }
        .av-msg { font-size:12px; color:var(--av-muted); min-height:16px; }
        .av-msg.error { color:var(--av-bad); }
        .av-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
        .av-card { border:1px solid var(--av-line); border-radius:14px; overflow:hidden; background:rgba(12,13,27,.72); cursor:pointer; transition:transform .18s,border-color .18s; }
        .av-card:hover { transform:translateY(-2px); border-color:rgba(123,92,255,.55); }
        .av-card-media { aspect-ratio:3/4; background:#090a13; display:flex; align-items:center; justify-content:center; color:var(--av-muted); position:relative; }
        .av-card-media img { width:100%; height:100%; object-fit:cover; }
        .av-card-meta { position:absolute; left:6px; bottom:6px; display:flex; gap:4px; }
        .av-pill { font-size:11px; padding:2px 7px; border-radius:999px; background:rgba(0,0,0,.6); color:#eef; display:flex; align-items:center; gap:4px; }
        .av-pill svg { width:12px; height:12px; }
        .av-card-name { padding:9px 11px; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .av-empty { padding:40px; text-align:center; color:var(--av-muted); border:1px dashed var(--av-line); border-radius:14px; }
        .av-empty svg { width:48px; height:48px; opacity:.5; }
        .av-modal { position:fixed; inset:0; z-index:20; background:rgba(5,6,14,.86); display:flex; align-items:center; justify-content:center; padding:18px; }
        .av-modal[hidden] { display:none; }
        .av-modal-card { width:min(1100px,100%); max-height:92vh; overflow:auto; background:#12132a; border:1px solid var(--av-line); border-radius:16px; padding:16px; }
        .av-modal-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
        .av-modal-head h2 { margin:0; font-size:18px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .av-modal .av-views { grid-template-columns:repeat(4,1fr); }
        .av-lightbox { position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center; cursor:zoom-out; }
        .av-lightbox img { max-width:96vw; max-height:94vh; }
        .av-lightbox[hidden] { display:none; }
        [data-tip] { position:relative; }
        [data-tip]:hover::after { content:attr(data-tip); position:absolute; left:50%; bottom:calc(100% + 6px); transform:translateX(-50%); white-space:nowrap; background:#05060d; color:#eef; border:1px solid var(--av-line); padding:4px 8px; border-radius:6px; font-size:11px; z-index:40; pointer-events:none; }
        @keyframes avspin { to { transform:rotate(360deg); } }
        @media(max-width:860px){ .av-build{grid-template-columns:1fr} .av-drop{aspect-ratio:4/3} .av-views{grid-template-columns:repeat(4,1fr)} .av-bar nav a:not([aria-current]){display:none} }
    </style>
</head>
<body class="avatar-page">
<header class="av-bar">
    <a class="av-brand" href="/">AutoRig</a>
    <nav aria-label="AI tools">
        <a href="/nodes">Nodes</a>
        <a href="/image">Image</a>
        <a href="/video">Video</a>
        <a href="/avatars" aria-current="page">Avatars</a>
    </nav>
</header>
<main class="av-wrap">
    <h1 class="av-title">Avatars</h1>
    <section class="av-build" aria-label="Build an Avatar">
        <div class="av-drop" id="av-drop" tabindex="0" role="button" data-tip="Drop, paste or choose a picture or a video" aria-label="Choose a picture or a video">
            <svg class="av-drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><g class="arrow"><path d="M19 3v6"/><path d="M16.5 5.5 19 3l2.5 2.5"/></g></svg>
        </div>
        <input id="av-file" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm,video/quicktime" hidden>
        <div class="av-side">
            <div class="av-row">
                <label class="av-chip" data-tip="Outfit (blank keeps the source's)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M8 3 4 6l2 4 2-1v12h8V9l2 1 2-4-4-3c-.7 1.5-2.2 2.5-4 2.5S8.7 4.5 8 3z"/></svg><input id="av-outfit" maxlength="300" aria-label="Outfit"></label>
                <label class="av-chip" data-tip="Name (blank: Vision names it)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8" r="1.4"/></svg><input id="av-name" maxlength="120" aria-label="Name"></label>
                <button class="av-icon-btn primary" id="av-build" type="button" disabled data-tip="Build Avatar" aria-label="Build Avatar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg></button>
            </div>
            <div class="av-stages" id="av-stages" aria-label="Progress"></div>
            <div class="av-views" id="av-live-views"></div>
            <div class="av-msg" id="av-msg" role="status" aria-live="polite"></div>
        </div>
    </section>
    <div class="av-row" style="margin-bottom:12px">
        <h2 style="margin:0;font-size:16px;flex:1">Library</h2>
        <a class="av-icon-btn" href="/nodes" data-tip="Open Nodes" aria-label="Open Nodes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="6" height="5" rx="1"/><rect x="15" y="15" width="6" height="5" rx="1"/><path d="M9 6.5h3v11h3"/></svg></a>
        <button class="av-icon-btn" id="av-refresh" type="button" data-tip="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </div>
    <div id="av-library" class="av-grid"></div>
</main>
<div class="av-modal" id="av-modal" hidden>
    <div class="av-modal-card" role="dialog" aria-modal="true" aria-labelledby="av-modal-name">
        <div class="av-modal-head">
            <h2 id="av-modal-name"></h2>
            <span class="av-pill" id="av-modal-version"></span>
            <button class="av-icon-btn" id="av-modal-info" type="button" data-tip="" aria-label="Description"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
            <a class="av-icon-btn" id="av-modal-sheet" target="_blank" rel="noopener" data-tip="Sheet" aria-label="Sheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></a>
            <button class="av-icon-btn" id="av-modal-copy" type="button" data-tip="Copy Avatar id" aria-label="Copy Avatar id"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>
            <button class="av-icon-btn" id="av-modal-close" type="button" data-tip="Close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="av-views" id="av-modal-views"></div>
    </div>
</div>
<div class="av-lightbox" id="av-lightbox" hidden><img alt=""></div>
</body>
</html>
