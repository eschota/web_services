# Include inside the existing autorig.online HTTPS server. Other routes retain
# their existing upstreams. Build filenames are verified content hashes.
location = /gravityhouse {
    return 308 /gravityhouse/;
}
location = /gravityhouse/settings.json {
    alias /srv/autorig/webgl-assets/gravityhouse/data/settings.json;
    default_type application/json;
    expires -1;
    etag off;
    if_modified_since off;
}
location = /gravityhouse/settings-schema.json {
    alias /srv/autorig/webgl-assets/gravityhouse/settings-service/schema.json;
    default_type application/json;
    expires -1;
}
location ^~ /gravityhouse/api/ {
    proxy_pass http://127.0.0.1:8263;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 8k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
location ^~ /gravityhouse/ {
    root /srv/autorig/webgl-assets/gravityhouse/current;
    index index.html;
    autoindex off;
    etag on;
    expires -1;
    gzip_static on;
    try_files $uri $uri/ =404;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        application/wasm wasm;
        application/octet-stream data;
    }
    default_type application/octet-stream;
    # Keep old hashed payloads available while an earlier page is loading.
    location /gravityhouse/Build/ {
        root /srv/autorig/webgl-assets/gravityhouse/shared;
        expires 1y;
        gzip_static on;
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
}
