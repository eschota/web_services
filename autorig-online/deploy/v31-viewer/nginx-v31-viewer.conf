        # Viewer V3.1 (2026-10-17): part relabel, the V3.1 fixture stream, the replay preference (autorig-v31-viewer)
        location ~ "^/api/mt/runs/[0-9a-f]{20}/(parts/[a-z][a-z0-9_:-]{0,47}/label|parts/labels|v31/(fixture|fx/[A-Za-z0-9_.-]+))$" {
            proxy_pass http://127.0.0.1:8277;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location ~ "^/api/mt/v31/(prefs|health)$" {
            proxy_pass http://127.0.0.1:8277;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
