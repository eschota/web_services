    # AutoRig vehicle conveyor (autorig-vehicle.service, mt/vehicle_v3_service.py on 8284). Insert inside the
    # autorig.online server block BEFORE `location ^~ /api/mt/` so it wins the prefix match.
    location ^~ /api/mt/vehicle {
        limit_req zone=autorig_ai_read_limit burst=100 nodelay;
        limit_req_status 429;
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8284;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
