limit_req_zone $binary_remote_addr zone=autorig_api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=autorig_upload_limit:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name autorig.online www.autorig.online;
    return 301 https://autorig.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autorig.online;

    ssl_certificate /etc/letsencrypt/live/autorig.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autorig.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AutoRigSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /srv/autorig/current/autorig-online/static;
    index index.html;
    client_max_body_size 128m;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # FastAPI performs owner/admin authorization and then internally redirects
    # here. The location is unreachable from a public URL, while nginx still
    # handles byte ranges and large files without occupying the uvicorn worker.
    location ^~ /_autorig_artifacts/ {
        internal;
        alias /srv/autorig/data/artifact-cache/;
        types {
            model/gltf-binary glb;
            video/mp4 mp4;
            video/quicktime mov;
            application/zip zip;
            image/jpeg jpg jpeg;
            image/png png;
            application/json json;
        }
        default_type application/octet-stream;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /static/tasks/ { return 404; }

    location /static/ {
        alias /srv/autorig/current/autorig-online/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /u/ {
        alias /srv/autorig/data/var/uploads/;
        expires 24h;
        add_header Cache-Control "public";
    }

    location ^~ /renderfin/render/ {
        alias /srv/autorig/data/var/renderfin/render/;
        expires 60s;
        add_header Cache-Control "public, max-age=60";
    }

    location /renderfin/ {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    location ~ ^/api/task/.+/(downloads/bundle|bundle\.zip)$ {
        limit_req zone=autorig_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /api/task/create {
        limit_req zone=autorig_upload_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=autorig_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ /\. { deny all; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.autorig.online;
    ssl_certificate /etc/letsencrypt/live/autorig.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autorig.online/privkey.pem;
    return 301 https://autorig.online$request_uri;
}
