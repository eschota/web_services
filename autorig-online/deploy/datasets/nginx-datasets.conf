# Inside the autorig.online server block of /etc/nginx/sites-enabled/autorig.online-storage,
# before `location /api/` and `location /` (prefix ^~ wins anyway).
    location ^~ /datasets/files/ {
        alias /srv/autorig/data/datasets/;
        autoindex off;
        location ~ /\. { deny all; }
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location ^~ /datasets/api/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8286;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }
