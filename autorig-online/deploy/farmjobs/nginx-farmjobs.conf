# Inside the `server_name autorig.online` 443 block of /etc/nginx/sites-available/autorig.online-storage,
# before `location /api/`. Boxes authenticate with their own Bearer key (farmjobs.py newkey).
    location ^~ /api/farmjobs/ {
        limit_req zone=autorig_ai_read_limit burst=100 nodelay;
        limit_req_status 429;
        client_max_body_size 70m;
        proxy_pass http://127.0.0.1:8262;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
