# Owner 2026-10-11: customer tasks first. The extended autotests (heavy) run at nice 19 / idle IO, capped at 2 CPUs and
# 2 parallel jobs, and wait (up to 3 h) until the VPS load is low and no MT run is busy before they start.
[Service]
Nice=19
CPUQuota=200%
MemoryMax=4G
ExecStartPre=/bin/sh -c "for i in $(seq 1 360); do L=$(cut -d. -f1 /proc/loadavg); [ \"$L\" -lt 8 ] && exit 0; sleep 30; done; exit 1"
ExecStart=
ExecStart=/srv/autorig/venv/bin/python3 -P /srv/autorig/autotests/autotests.py gate all --tier extended --jobs 2 --card --post-dev-on-fail
TimeoutStartSec=14400
