location = /ivy { return 308 /ivy/; }
location ^~ /ivy/ {
    root /srv/autorig/webgl-assets/ivy/current;
    index index.html;
    autoindex off;
    etag on;
    expires -1;
    gzip_static on;
    try_files $uri $uri/ =404;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        application/wasm wasm;
        image/webp webp;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
        application/octet-stream data;
    }
    default_type application/octet-stream;
    # Keep old hashed payloads available while an earlier page is loading.
    location /ivy/Build/ {
        root /srv/autorig/webgl-assets/ivy/shared;
        expires 1y;
        gzip_static on;
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
}
