# Inside the `server_name autorig.online` 443 block of
# /etc/nginx/sites-available/autorig.online-storage, before `location /api/`.
# Exact and ^~ prefix locations win over the generic /api/ backend proxy, so
# the fleet API never reaches (or depends on) autorig-storage.
    location = /api/fleet {
        limit_req zone=autorig_ai_read_limit burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8255;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location ^~ /api/fleet/ {
        limit_req zone=autorig_ai_read_limit burst=100 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8255;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
