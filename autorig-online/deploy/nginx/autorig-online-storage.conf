    }
    location /auth/ {
        proxy_pass http://127.0.0.1:8200;
        error_page 502 504 = @autorig_restarting_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # R80-15 IRON CIRCUIT tuning API (longer ^~ prefix than /airacing/ static alias, so it wins)
    location ^~ /airacing/api/tuning/ {
        limit_req zone=autorig_api_limit burst=20 nodelay;
        client_max_body_size 300k;
        proxy_pass http://127.0.0.1:8240/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie "";
        proxy_read_timeout 20s;
    }
    location = /airacing { return 301 /airacing/; }
    location ^~ /airacing/ {
        alias /srv/airacing/;
        index index.html;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        proxy_pass http://127.0.0.1:8200;
        error_page 502 504 = @autorig_restarting_page;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ~ /\. {
        deny all;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.autorig.online;
    ssl_certificate /etc/letsencrypt/live/autorig.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autorig.online/privkey.pem;
    return 301 https://autorig.online$request_uri;
}
