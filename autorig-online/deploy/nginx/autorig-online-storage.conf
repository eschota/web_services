limit_req_zone $binary_remote_addr zone=autorig_api_limit:10m rate=10r/s;
# Node graphs poll many independent jobs while submitting bounded render batches.
limit_req_zone $binary_remote_addr zone=autorig_ai_read_limit:10m rate=120r/s;
limit_req_zone $binary_remote_addr zone=autorig_ai_submit_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=autorig_upload_limit:10m rate=2r/s;

# Task page V3 / live static (2026-10-10): JS and CSS whose ?v= is an exact
# 10-hex content stamp are immutable; any other JS/CSS revalidates on every load
# (no-cache + ETag/Last-Modified), so a live edit reaches the next page load.
map $uri $autorig_static_code {
    "~*\.(?:m?js|css)$" 1;
    default 0;
}
map "$autorig_static_code:$arg_v" $autorig_static_cache_control {
    "~^1:[0-9a-f]{10}$" "public, max-age=604800, immutable";
    "~^1:" "no-cache";
    default "public, max-age=604800, immutable";
}
server {
    listen 37.187.57.177:80;
    server_name autorig.online www.autorig.online;
    return 301 https://autorig.online$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autorig.online;
    # task_id alias (2026-10-11): /task?task_id=<uuid> or ?task=<uuid> -> the canonical /task?id=<uuid>
    if ($request_uri ~* "^(/(?:ru|fa|zh|hi))?/task\?(?:[^#]*&)?(?:task_id|task)=([0-9a-f-]{36})") {
        return 301 $1/task?id=$2;
    }
    ssl_certificate /etc/letsencrypt/live/autorig.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autorig.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AutoRigSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    root /srv/autorig/current/autorig-online/static;
    include /etc/nginx/snippets/autorig-jellyfish-animated-webgl.conf;
    include /etc/nginx/snippets/autorig-real-rain-webgl.conf;
    include /etc/nginx/snippets/autorig-skeleton-with-organs-webgl.conf;
    include /etc/nginx/snippets/autorig-realistic-human-organs-webgl.conf;
    include /etc/nginx/snippets/autorig-sci-fi-top-down-facility-generator-webgl.conf;
    include /etc/nginx/snippets/autorig-alchemy-interior-props-webgl.conf;
    include /etc/nginx/snippets/autorig-humanoid-robot-collection-webgl.conf;
    include /etc/nginx/snippets/autorig-human-embryo-webgl.conf;
    include /etc/nginx/snippets/autorig-automatic-3d-printers-webgl.conf;
    include /etc/nginx/snippets/autorig-modular-gaming-pc-webgl.conf;
    include /etc/nginx/snippets/autorig-geopolitical-earth-planet-webgl.conf;
    include /etc/nginx/snippets/autorig-childhood-room-webgl.conf;
    include /etc/nginx/snippets/autorig-dynamic-ivy-webgl.conf;
    include /etc/nginx/snippets/autorig-ultimate-earth-planet-webgl.conf;
    include /etc/nginx/snippets/autorig-modern-convention-center-webgl.conf;
    include /etc/nginx/snippets/autorig-moon-base-webgl.conf;
    include /etc/nginx/snippets/autorig-business-center-lobby-webgl.conf;
    include /etc/nginx/snippets/autorig-horror-night-city-webgl.conf;
    include /etc/nginx/snippets/autorig-orbital-observatory-webgl.conf;
    include /etc/nginx/snippets/autorig-magnia-museum-webgl.conf;
    include /etc/nginx/snippets/autorig-surgical-operating-room-webgl.conf;
    include /etc/nginx/snippets/autorig-bar-and-kitchen-webgl.conf;
    include /etc/nginx/snippets/autorig-exhibition-hall-futuristic-webgl.conf;
    include /etc/nginx/snippets/autorig-real-underwater-webgl.conf;
    include /etc/nginx/snippets/autorig-real-vision-webgl.conf;
    include /etc/nginx/snippets/autorig-real-outline-webgl.conf;
    include /etc/nginx/snippets/autorig-disintegrator-webgl.conf;
    include /etc/nginx/snippets/autorig-real-poison-webgl.conf;
    include /etc/nginx/snippets/autorig-real-snow-webgl.conf;
    include /etc/nginx/snippets/autorig-v3-viewer-static.conf;
    include /etc/nginx/snippets/autorig-real-flame-webgl.conf;
    include /etc/nginx/snippets/autorig-planet-shader-studio-webgl.conf;
    include /etc/nginx/snippets/autorig-assets-gallery.conf;
    include /etc/nginx/snippets/autorig-real-volumetric-webgl.conf;
    include /etc/nginx/snippets/oneclick-input.conf;
    include /etc/nginx/snippets/autorig-ivy-webgl.conf;
    include /etc/nginx/snippets/autorig-gravityhouse-webgl.conf;
    include /etc/nginx/snippets/autorig-topdown-webgl.conf;
    include /etc/nginx/snippets/autorig-dev.conf;
    include /etc/nginx/snippets/autorig-nsfw.conf;
    include /etc/nginx/snippets/autorig-constructor.conf;
    include /etc/nginx/snippets/autorig-sandflow-realflow.conf;
    include /etc/nginx/snippets/sandflow-online.conf;
    include /etc/nginx/snippets/autorig-ethereal-fluids-webgl.conf;
    include /etc/nginx/snippets/tarz-webgl.conf;
    include /etc/nginx/snippets/autorig-uploader.conf;
    include /etc/nginx/snippets/autorig-public-chat.conf;
    index index.html;
    client_max_body_size 128m;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;
    location ^~ /_autorig_artifacts/ {
        internal;
        alias /srv/autorig/data/artifact-cache/;
        types {
            model/gltf-binary glb;
            video/mp4 mp4;
            video/quicktime mov;
            application/zip zip;
            image/jpeg jpg jpeg;
            image/png png;
            application/json json;
        }
        default_type application/octet-stream;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /_autorig_glb_cache/ {
        internal;
        alias /srv/autorig/data/static/glb_cache/;
        default_type model/gltf-binary;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /_autorig_task_cache/ {
        internal;
        alias /srv/autorig/data/static/tasks/;
        types {
            model/gltf-binary glb;
            application/zip zip;
        }
        default_type application/octet-stream;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /static/tasks/ {
        return 404;
    }
    # Live static (Task page · V3, 2026-10-10): the atomic overlay
    # /srv/autorig/live/static first (sudo python3 /srv/autorig/tools/live_static.py),
    # then the current release.
    location /static/ {
        root /srv/autorig;
        try_files /live$uri /current/autorig-online$uri =404;
        add_header Cache-Control $autorig_static_cache_control;
    }
    location /u/ {
        alias /srv/autorig/data/var/uploads/;
        expires 24h;
        add_header Cache-Control "public";
    }
    location ^~ /renderfin/render/ {
        alias /srv/autorig/data/var/renderfin/render/;
        expires 60s;
        add_header Cache-Control "public, max-age=60";
    }
    location /renderfin/ {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }
    location ~ ^/api/task/.+/(downloads/bundle|bundle\.zip)$ {
        limit_req zone=autorig_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8200;
        error_page 502 504 = @autorig_restarting_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location = /api/task/create {
        limit_req zone=autorig_upload_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8200;
        error_page 502 504 = @autorig_restarting_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    location ~ "^/api/ai/(render-status/|status/|fleet$|model-settings$|model-catalogue$|model-preview/|models$|services$|graphs/[a-f0-9]{12}$|graphs/[a-f0-9]{12}/(revision|results)$|media/resolve$|media-size$|thumb$|my-tasks$|queue/admin$|graph/templates$|graph-edits/schema$|build$|video-tools/status/)" {
        limit_req zone=autorig_ai_read_limit burst=300 nodelay;
        limit_req_status 429;
        error_page 429 = @autorig_ai_rate_limited;

        proxy_pass http://127.0.0.1:8200;
        error_page 502 504 = @autorig_restarting_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    location ~ ^/api/(image|video|vision|text2text|controlnet|upscale|detail|facefix|3dmodel|ai/avatar-image|ai/video-reference)$ {
        limit_req zone=autorig_ai_submit_limit burst=200 nodelay;
        limit_req_status 429;
        error_page 429 = @autorig_ai_rate_limited;

        proxy_pass http://127.0.0.1:8200;
        error_page 502 504 = @autorig_restarting_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    # autorig-storage restarting (owner, 2026-09-28): instead of a bare 502,
    # pages get a "restarting, retrying" page that reloads itself, API calls a
    # 503 with Retry-After.
    location @autorig_restarting_api {
        default_type application/json;
        add_header Retry-After 3 always;
        add_header Cache-Control no-store always;
        return 503 '{"detail":{"error_string":"backend_restarting","message_string":"AutoRig is restarting; retry in a few seconds."}}';
    }
    location @autorig_restarting_page {
        default_type text/html;
        add_header Retry-After 3 always;
        add_header Cache-Control no-store always;
        return 503 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoRig is restarting</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0f;color:#f0f0f5;font:16px/1.5 system-ui,sans-serif}.b{text-align:center;padding:24px}.s{width:36px;height:36px;margin:0 auto 16px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#6366f1;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#9aa0b5}</style></head><body><div class="b"><div class="s"></div><div>AutoRig is restarting, retrying&hellip;</div><small id="t">This page reloads by itself.</small></div><script>var n=0;function go(){n++;document.getElementById("t").textContent="Attempt "+n+"…";fetch(location.href,{method:"HEAD",cache:"no-store"}).then(function(r){if(r.status!==503&&r.status!==502)location.reload();else setTimeout(go,2000)}).catch(function(){setTimeout(go,2000)})}setTimeout(go,2000);</script></body></html>';
    }
    location @autorig_ai_rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
        return 429 '{"detail":{"error_string":"rate_limited","message_string":"The request was not accepted yet; retry shortly."}}';
    }
    # Video uploads need larger streamed request bodies and a longer
    # upstream window than ordinary API calls.
    # Preserve the Telegram Developer Validator and route YouTube uploads
    # through the authenticated AutoRig backend.
    location = /developers {
        alias /srv/autorig/current/autorig-online/static/developers.html;
        default_type text/html;
    }
    location = /dev/youtube {
        alias /srv/autorig/current/autorig-online/static/youtube-upload.html;
        default_type text/html;
    }
    location = /dev/youtube/skill.md {
        proxy_pass http://127.0.0.1:8200/api/youtube/skill.md;
        error_page 502 504 = @autorig_restarting_page;
        default_type text/markdown;
    }
    # Astra's live tool catalogue (owner 2026-10-10: «Список инструментов должен быть по адресу
    # www.autorig.online/dev/tools»): astra-web.service, mt/astra/web.py. Exact matches beat ^~ /dev.
    location = /dev/tools {
        proxy_pass http://127.0.0.1:8267;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /dev/tools.json {
        proxy_pass http://127.0.0.1:8267;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /dev/api/youtube/ {
        limit_req_status 429;
        error_page 429 = @autorig_ai_rate_limited;
        limit_req zone=autorig_api_limit burst=20 nodelay;
        client_max_body_size 4096m;
        proxy_pass http://127.0.0.1:8200/api/youtube/;
        error_page 502 504 = @autorig_restarting_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    location = /api/youtube/videos {
        limit_req_status 429;
        error_page 429 = @autorig_ai_rate_limited;
        limit_req zone=autorig_api_limit burst=20 nodelay;
        client_max_body_size 4096m;
        proxy_pass http://127.0.0.1:8200;
        error_page 502 504 = @autorig_restarting_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    # 3D video motion transfer toolkit: projections, Qwen maps, rig kit, graph-run API
    # (repo eschota/3d_video_motion_transfer, service autorig-mt on 8251)
    # Blender worker results (rigged FBX / USDZ / OBJ zip, props GLBs): one base64 JSON per job, worker-key only
    location ^~ /api/mt/blender/jobs/ {
        client_max_body_size 512m;
        proxy_pass http://127.0.0.1:8251;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
    # Rig judge V3: bone-code joint renders, farm Vision judges, AI pose, auto-fix
    # (repo eschota/3d_video_motion_transfer mt/joint_judge_service.py, service autorig-rig-judge on 8252).
    # A longer prefix than ^~ /api/mt/, so it wins; everything else under /api/mt/ stays with autorig-mt.
    location ^~ /api/mt/rig-judge {
        limit_req zone=autorig_ai_read_limit burst=100 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8252;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location ^~ /api/mt/ {
        # unity Build served by nginx (2026-10-11): 18 MB of hashed WebGL files went through the single-worker MT
        # uvicorn and waited ~17 s for the first byte under load. index.html stays on MT: it injects the OG tags.
        location ~ "^/api/mt/unity/(?<ubuild>[A-Za-z0-9._-]+)/Build/(?<ufile>[A-Za-z0-9._-]+)$" {
            alias /srv/autorig/data/motion_transfer/unity/$ubuild/Build/$ufile;
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }
        # Viewer · V3 (2026-10-10): the run's session log, card and texture cache (autorig-session-log.service)
        location ~ "^/api/mt/runs/[0-9a-f]{20}/session-(log|card|media/[0-9a-f]{16}[a-z0-9.-]*)$" {
            proxy_pass http://127.0.0.1:8273;
        }
        limit_req zone=autorig_ai_read_limit burst=300 nodelay;
        limit_req_status 429;
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:8251;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    # Unity viewer feed for a task's own models (task_page_v3_routes.py): the
