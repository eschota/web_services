limit_req_zone $binary_remote_addr zone=autorig_api_limit:10m rate=10r/s;
# Node graphs poll many independent jobs while submitting bounded render batches.
limit_req_zone $binary_remote_addr zone=autorig_ai_read_limit:10m rate=120r/s;
limit_req_zone $binary_remote_addr zone=autorig_ai_submit_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=autorig_upload_limit:10m rate=2r/s;

# Task page V3 / live static (2026-10-10): JS and CSS whose ?v= is an exact
# 10-hex content stamp are immutable; any other JS/CSS revalidates on every load
# (no-cache + ETag/Last-Modified), so a live edit reaches the next page load.
map $uri $autorig_static_code {
    "~*\.(?:m?js|css)$" 1;
    default 0;
}
map "$autorig_static_code:$arg_v" $autorig_static_cache_control {
    "~^1:[0-9a-f]{10}$" "public, max-age=604800, immutable";
    "~^1:" "no-cache";
    default "public, max-age=604800, immutable";
}
server {
    listen 37.187.57.177:80;
    server_name autorig.online www.autorig.online;
    return 301 https://autorig.online$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autorig.online;
    ssl_certificate /etc/letsencrypt/live/autorig.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autorig.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AutoRigSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    root /srv/autorig/current/autorig-online/static;
    location = /developers {
        alias /srv/autorig/current/autorig-online/static/developers.html;
    }
    location = /dev/youtube {
        alias /srv/autorig/current/autorig-online/static/youtube-upload.html;
    }
    location = /dev/youtube/skill.md {
        proxy_pass http://127.0.0.1:8200/api/youtube/skill.md;
        default_type text/markdown;
    }
    include /etc/nginx/snippets/autorig-ivy-webgl.conf;
    include /etc/nginx/snippets/autorig-gravityhouse-webgl.conf;
    include /etc/nginx/snippets/autorig-topdown-webgl.conf;
    include /etc/nginx/snippets/autorig-dev.conf;
    include /etc/nginx/snippets/autorig-constructor.conf;
    include /etc/nginx/snippets/autorig-sandflow-realflow.conf;
    include /etc/nginx/snippets/sandflow-online.conf;
    include /etc/nginx/snippets/autorig-ethereal-fluids-webgl.conf;
    include /etc/nginx/snippets/tarz-webgl.conf;
    index index.html;
    client_max_body_size 128m;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;
    location ^~ /_autorig_artifacts/ {
        internal;
        alias /srv/autorig/data/artifact-cache/;
        types {
            model/gltf-binary glb;
            video/mp4 mp4;
            video/quicktime mov;
            application/zip zip;
            image/jpeg jpg jpeg;
            image/png png;
            application/json json;
        }
        default_type application/octet-stream;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /_autorig_glb_cache/ {
        internal;
        alias /srv/autorig/data/static/glb_cache/;
        default_type model/gltf-binary;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /_autorig_task_cache/ {
        internal;
        alias /srv/autorig/data/static/tasks/;
        types {
            model/gltf-binary glb;
            application/zip zip;
        }
        default_type application/octet-stream;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /static/tasks/ {
        return 404;
    }
    # Live static (Task page · V3, 2026-10-10): the atomic overlay
    # /srv/autorig/live/static first (sudo python3 /srv/autorig/tools/live_static.py),
    # then the current release.
    location /static/ {
        root /srv/autorig;
        try_files /live$uri /current/autorig-online$uri =404;
        add_header Cache-Control $autorig_static_cache_control;
    }
    location /u/ {
        alias /srv/autorig/data/var/uploads/;
        expires 24h;
        add_header Cache-Control "public";
    }
    location ^~ /renderfin/render/ {
        alias /srv/autorig/data/var/renderfin/render/;
        expires 60s;
        add_header Cache-Control "public, max-age=60";
    }
    location /renderfin/ {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }
    location ~ ^/api/task/.+/(downloads/bundle|bundle\.zip)$ {
        limit_req zone=autorig_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location = /api/task/create {
        limit_req zone=autorig_upload_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    location ~ "^/api/ai/(render-status/|status/|fleet$|model-settings$|model-catalogue$|model-preview/|models$|services$|graphs/[a-f0-9]{12}$)" {
        limit_req zone=autorig_ai_read_limit burst=300 nodelay;
        limit_req_status 429;
        error_page 429 = @autorig_ai_rate_limited;

        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    location ~ ^/api/(image|video|vision|text2text|controlnet|upscale|detail|facefix|3dmodel|ai/avatar-image|ai/video-reference)$ {
        limit_req zone=autorig_ai_submit_limit burst=200 nodelay;
        limit_req_status 429;
        error_page 429 = @autorig_ai_rate_limited;

        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    location @autorig_ai_rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
        return 429 '{"detail":{"error_string":"rate_limited","message_string":"The request was not accepted yet; retry shortly."}}';
    }
    # Video uploads need larger streamed request bodies and a longer
    # upstream window than ordinary API calls.
    location = /developers {
        alias /srv/autorig/current/autorig-online/static/developers.html;
        default_type text/html;
    }
    location = /dev/youtube {
        alias /srv/autorig/current/autorig-online/static/youtube-upload.html;
        default_type text/html;
    }
    location = /dev/youtube/skill.md {
        proxy_pass http://127.0.0.1:8200/api/youtube/skill.md;
        default_type text/markdown;
    }
    # Route this one YouTube upload path through the main backend while leaving
    # the Telegram Developer Validator under /dev on its existing upstream.
    location ^~ /dev/api/youtube/ {
        limit_req_status 429;
        error_page 429 = @autorig_ai_rate_limited;
        limit_req zone=autorig_api_limit burst=20 nodelay;
        client_max_body_size 4096m;
        proxy_pass http://127.0.0.1:8200/api/youtube/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    location = /api/youtube/videos {
        limit_req_status 429;
        error_page 429 = @autorig_ai_rate_limited;
        limit_req zone=autorig_api_limit burst=20 nodelay;
        client_max_body_size 4096m;
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
    # Unity viewer feed for a task's own models (task_page_v3_routes.py): the
    # viewer reads a burst of files at load, like /api/mt/.
    location ^~ /api/task-viewer/ {
        limit_req zone=autorig_ai_read_limit burst=300 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8200;
        error_page 502 504 = @autorig_restarting_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    location /api/ {
        limit_req_status 429;
        error_page 429 = @autorig_ai_rate_limited;
        limit_req zone=autorig_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    location /auth/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ~ /\. {
        deny all;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.autorig.online;
    ssl_certificate /etc/letsencrypt/live/autorig.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autorig.online/privkey.pem;
    return 301 https://autorig.online$request_uri;
}
