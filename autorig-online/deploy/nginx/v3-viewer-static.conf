# Public V3 HTML shell only. Task/manifest/artifact authorization stays in
# v3_viewer_routes.py; no task data is served by these locations.
# Keeping HTML on the release symlink avoids backend restarts for viewer UI
# releases. In particular, a UI deployment must not trigger startup queue reset.
location = /viewer {
    alias /srv/autorig/current/autorig-online/static/viewer-v3.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
location ~ "^/(?:viewer/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|(?:task/)?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/viewer)$" {
    root /srv/autorig/current/autorig-online/static;
    try_files /viewer-v3.html =404;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
