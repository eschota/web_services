# Mirrored from /etc/nginx/sites-enabled/autorig.online-storage (server autorig.online, before /_autorig_artifacts/).
# SEO · V3 preview clips (2026-10-11): /og/task/<id>.mp4 is checked by the backend, then served here.
location ^~ /_autorig_previews_v3/ {
    internal;
    alias /srv/autorig/data/static/previews-v3/;
    types { video/mp4 mp4; }
    add_header Cache-Control "public, max-age=604800" always;
    add_header Access-Control-Allow-Origin "*" always;
}
