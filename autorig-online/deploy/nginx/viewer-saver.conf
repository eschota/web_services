# viewer_saver.exe releases (2026-10-12, R:\3d_video_motion_transfer\tools\viewer_release.ps1).
# Inside the `server_name autorig.online` 443 block of /etc/nginx/sites-available/autorig.online-storage, nested as the
# first location of `location ^~ /api/mt/ {`: versioned zips + manifests, read by the farm boxes
# (gallery-poster/viewer_saver_box.py) and boxes.json (per-box saver versions, also in /api/fleet).
        location ^~ /api/mt/saver/ {
            alias /srv/autorig/data/viewer-saver/;
            add_header Cache-Control "no-cache" always;     # manifests change; the zips are per tag (ETag 304)
            add_header X-Content-Type-Options nosniff always;
        }
