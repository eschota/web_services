# Mirrored from /etc/nginx/sites-enabled/autorig.online-storage (server autorig.online, before `location /static/`).
# Gallery perf (2026-10-15): small WebP card posters made by autorig-gallery-small-poster
# (deploy/gallery-poster/gallery_small_poster.py), content-versioned by ?v=<mtime>.
location ^~ /pw/ {
    alias /srv/autorig/data/static/posters-s/;
    types { image/webp webp; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log off;
}
