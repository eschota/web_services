    # AutoRig rooms: presence for the multiplayer viewer (service autorig-rooms on 8264).
    # Exact locations only. The socket is long-lived and anonymous.
    location = /api/rooms/ws {
        proxy_pass http://127.0.0.1:8264;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }
    location = /api/rooms {
        limit_req zone=autorig_ai_read_limit burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8264;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location = /api/rooms/busiest {
        limit_req zone=autorig_ai_read_limit burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8264;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
