# SEO · previews (2026-10-12): the farm previews and the view copies need these paths; a child killed by the OOM
# killer (a heavy model) must not take the whole service down and into a restart loop.
[Service]
ReadWritePaths=/srv/autorig/data/static/previews-v3 /srv/autorig/data/farmjobs /srv/autorig/data/motion_transfer/runs
OOMPolicy=continue
