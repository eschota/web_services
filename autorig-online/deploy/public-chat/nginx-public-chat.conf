# Public chat · V3 (2026-10-10) — installed as /etc/nginx/snippets/autorig-public-chat.conf and pulled
# into the `server_name autorig.online` 443 block of /etc/nginx/sites-available/autorig.online-storage
# with one `include /etc/nginx/snippets/autorig-public-chat.conf;` line. The exact and ^~ locations win
# over the generic /api/ backend proxy, so the chat never reaches or depends on autorig-storage.
# Service: autorig-public-chat.service on 127.0.0.1:8278 (deploy/public-chat/public_chat.py).

# Server-Sent Events: no buffering, a read timeout above the service's 10-minute stream lifetime.
location = /api/public-chat/stream {
    limit_req zone=autorig_api_limit burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8278;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 700s;
    proxy_read_timeout 700s;
    error_page 502 503 504 = @autorig_public_chat_down;
}
location ^~ /api/public-chat/ {
    limit_req zone=autorig_api_limit burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8278;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    error_page 502 503 504 = @autorig_public_chat_down;
}
location @autorig_public_chat_down {
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header Retry-After 5 always;
    return 503 '{"detail":{"error_string":"chat_unavailable","message_string":"The public chat is restarting."}}';
}

# People (owner 2026-10-10): round avatars cut from each person's latest model, the people API and the author
# gallery /author/<handle> (server-rendered, also under /ru /zh /hi /fa). Same service, same isolation.
location ^~ /api/avatar/ {
    limit_req zone=autorig_api_limit burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8278;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
location ^~ /api/people/ {
    limit_req zone=autorig_api_limit burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8278;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
location ~ "^/(?:(?:ru|zh|hi|fa)/)?author/[0-9a-f]{10}$" {
    limit_req zone=autorig_api_limit burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8278;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Language $http_accept_language;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    error_page 502 503 504 = @autorig_public_chat_down_page;
}
location @autorig_public_chat_down_page {
    default_type text/html;
    add_header Cache-Control no-store always;
    add_header Retry-After 5 always;
    return 503 '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoRig</title><p style="font:16px system-ui;padding:2rem">This page is restarting. Reload in a few seconds.</p>';
}
