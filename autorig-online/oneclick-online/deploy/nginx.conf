server {
    listen 37.187.57.177:80;
    server_name oneclick3d.xyz www.oneclick3d.xyz;
    location ^~ /.well-known/acme-challenge/ { root /srv/oneclick/acme; }
    location / { return 301 https://oneclick3d.xyz$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oneclick3d.xyz www.oneclick3d.xyz;
    ssl_certificate /etc/letsencrypt/live/oneclick3d.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oneclick3d.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 105m;
    client_body_timeout 60s;
    client_body_temp_path /srv/oneclick/data/nginx-spool;
    access_log /var/log/nginx/oneclick.access.log;
    error_log /var/log/nginx/oneclick.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~* \.(bak|old|orig|save|swp|py|env)([.-].*)?$ { return 404; }
    location ^~ /static/ {
        alias /srv/oneclick/current/static/;
        expires 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:8244;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
