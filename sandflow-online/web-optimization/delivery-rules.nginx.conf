# Web-static locations for the NEW fallback-enabled client. Include alongside the
# existing, more-specific /sandflow/api/, /sandflow/ws/ and /sandflow/health routes.
# Replace __SANDFLOW_RELEASE_ROOT__ with one verified absolute immutable release path.
location = /sandflow {
    return 301 /sandflow/$is_args$args;
}
location = /sandflow/ {
    alias __SANDFLOW_RELEASE_ROOT__/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
location ~ ^/sandflow/s/[0-9a-fA-F]{32}$ {
    alias __SANDFLOW_RELEASE_ROOT__/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
location /sandflow/ {
    alias __SANDFLOW_RELEASE_ROOT__/;
    # .unityweb is a compressed fallback container, not a directly streamed wasm/js
    # representation. Unity fetches and decompresses it before compilation/execution.
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}
# Intentionally NO Content-Encoding: OnlineClientBuild sets decompressionFallback=true.
