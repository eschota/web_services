# QA-only static locations. This fragment MUST NOT replace or redefine the existing
# public /sandflow/ root, /sandflow/api/, /sandflow/ws/ or /sandflow/health routes.
# Replace the placeholder with the verified immutable online-web-qa release path.
location = /sandflow/qa {
    return 301 /sandflow/qa/$is_args$args;
}
location = /sandflow/qa/ {
    alias __SANDFLOW_QA_RELEASE_ROOT__/;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location ~ "^/sandflow/qa/s/[0-9a-fA-F]{32}$" {
    alias __SANDFLOW_QA_RELEASE_ROOT__/index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
# These three hash-only locations opt into native browser Brotli decompression.
# The build keeps Unity fallback enabled, so a missing header remains survivable;
# with this header the browser decodes once and Unity skips its JS decompressor.
location ~ "^/sandflow/qa/Build/([0-9a-fA-F]{32}\.wasm\.unityweb)$" {
    alias __SANDFLOW_QA_RELEASE_ROOT__/Build/$1;
    default_type application/wasm;
    add_header Content-Encoding "br" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location ~ "^/sandflow/qa/Build/([0-9a-fA-F]{32}\.framework\.js\.unityweb)$" {
    alias __SANDFLOW_QA_RELEASE_ROOT__/Build/$1;
    default_type application/javascript;
    add_header Content-Encoding "br" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location ~ "^/sandflow/qa/Build/([0-9a-fA-F]{32}\.data\.unityweb)$" {
    alias __SANDFLOW_QA_RELEASE_ROOT__/Build/$1;
    default_type application/octet-stream;
    add_header Content-Encoding "br" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
location /sandflow/qa/ {
    alias __SANDFLOW_QA_RELEASE_ROOT__/;
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
# Non-Unity assets remain unencoded by this fragment.
