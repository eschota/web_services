# Include ONLY inside the existing autorig.online TLS server.
# This foundation publishes health/API/WS, not an unverified playable release.
location = /sandflow/health {
    proxy_pass http://127.0.0.1:8270/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /sandflow/api/ {
    client_max_body_size 64m;
    proxy_pass http://127.0.0.1:8270/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
location ^~ /sandflow/ws/ {
    proxy_pass http://127.0.0.1:8270/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 40s;
}
