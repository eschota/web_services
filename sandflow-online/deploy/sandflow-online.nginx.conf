# Include ONLY inside the existing autorig.online TLS server.
# API/WS remain gated. The root serves the EXISTING public single-player prototype
# previously available at /realflow/, pinned to its exact release. This is not the
# new multiplayer client, and changes neither map.autorig.online nor /realflow/.
location = /sandflow {
    return 301 /sandflow/$is_args$args;
}
location ^~ /sandflow/ {
    alias /srv/autorig/webgl-assets/realflow/releases/sandflow-v0135-f957395/;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=60" always;
}
location = /sandflow/health {
    proxy_pass http://127.0.0.1:8270/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /sandflow/api/ {
    client_max_body_size 64m;
    proxy_pass http://127.0.0.1:8270/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
location ^~ /sandflow/ws/ {
    proxy_pass http://127.0.0.1:8270/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 40s;
}
