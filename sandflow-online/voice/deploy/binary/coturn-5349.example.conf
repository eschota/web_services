# Candidate for Debian coturn 4.6.1-1. Render an ignored runtime copy and replace
# the placeholder with the same random secret stored in LiveKit's secret_file.
listening-ip=37.187.57.177
relay-ip=37.187.57.177
tls-listening-port=5349

# TLS clients only. Keep UDP relay transport enabled between coturn and the co-hosted SFU.
no-udp
no-tcp
no-dtls
no-tcp-relay
allocation-default-address-family=ipv4

fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_RANDOM_SHARED_SECRET
realm=autorig.online
server-name=autorig.online
rest-api-separator=:

cert=/srv/sandflow/voice/certs/coturn/fullchain.pem
pkey=/srv/sandflow/voice/certs/coturn/privkey.pem
no-tlsv1
no-tlsv1_1

# Bound relay allocation pool. Because coturn and the only allowed peer (LiveKit)
# share this host, do not open this range generally at the public firewall.
min-port=40000
max-port=40127
user-quota=4
total-quota=128
stale-nonce=600
max-allocate-lifetime=3600

# A valid credential may relay only to the co-hosted SFU public address, not to
# arbitrary internet/private destinations. An explicit allow overrides the deny range.
denied-peer-ip=0.0.0.0-255.255.255.255
allowed-peer-ip=37.187.57.177
# Defense in depth only: coturn peer IPv6 range handling has had upstream security
# defects, so the separate UID ip6tables OUTPUT deny is authoritative.
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-multicast-peers

no-cli
no-software-attribute
simple-log
log-file=stdout
pidfile=/srv/sandflow/voice/.work/run/coturn/coturn.pid
proc-user=sandflow-turn
proc-group=sandflow-turn
