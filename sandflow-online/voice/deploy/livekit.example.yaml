port: 7880

rtc:
  # LiveKit bind_addresses is global; firewall must deny public 7880 instead of
  # binding all RTC listeners to loopback.
  use_external_ip: false
  node_ip: 37.187.57.177
  tcp_port: 7881
  udp_port: 7882

# Disabled for pinned v1.13.6: it listens on configured 5349 but advertises
# embedded TURN to clients as 443. See deploy/binary/README.md.
turn:
  enabled: false

# Replace both placeholders only in the ignored deploy/livekit.yaml file.
# Never commit the real key or secret.
keys:
  REPLACE_WITH_API_KEY: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS

logging:
  level: info
